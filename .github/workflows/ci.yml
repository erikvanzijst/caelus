name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

jobs:
  ui-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: |
          cd ui
          npm ci

      - name: Run UI tests (Vitest)
        run: |
          cd ui
          npm test

  # Validates products/catalog/ using the files alone — no database and no
  # cluster access — so a malformed catalog is caught in review rather than by
  # the catalog init container during a rollout.
  catalog-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint the product catalog
        run: |
          cd api
          uv sync
          uv run caelus catalog lint

  # Tests the client and proves its distribution installs. Defined in its own
  # workflow because `publish-cli.yml` runs the identical gate before it
  # uploads to PyPI — see the comment there.
  cli:
    uses: ./.github/workflows/cli-checks.yml

  publish-images:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [ui-test, api-test, catalog-lint, cli]
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and publish images
        run: ./scripts/build-images.sh --all

  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and run dev container tests
        uses: devcontainers/ci@v0.3
        with:
          # Image name for caching; not pushed
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          push: never
          runCmd: |
            cd api
            uv sync
            uv run pytest -s
