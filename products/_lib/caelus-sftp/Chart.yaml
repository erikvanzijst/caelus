apiVersion: v2
name: caelus-sftp
description: >-
  Library chart providing read-only SFTP access to a Caelus deployment's data
  PVCs. Emits the per-deployment credentials Secret, sshd init ConfigMap and
  Service, plus the atmoz/sftp sidecar container and its supporting volumes for
  wrapper-owned pods. See README.md for the contract.
type: library
version: 0.3.0
appVersion: "1.0.0"
maintainers:
  - name: Caelus Team
