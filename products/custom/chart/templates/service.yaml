apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "custom.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "custom.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # Named target, so the placeholder and a real user image are reached
      # identically as long as both honour the containerPort build contract.
      targetPort: http
