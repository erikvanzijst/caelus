{{- /*
The Service the SSH edge reaches this deployment through. `custom` declares an
**application-container session root**: a shell in the container the tenant's
own code runs in, file transfer into it, the PostgreSQL toolbox, and a forward
to the deployment's own database. The sidecar itself is spliced into the
application pod (see deployment.yaml) — it has to be in that pod to see the
application's processes at all, which is also why that pod sets
`shareProcessNamespace: true`.

See the ssh-sidecar library chart (products/_lib/ssh-sidecar-chart) for the
contract, and openspec/changes/archive/2026-09-03-unified-ssh-sidecar/design.md for why the session
root is the only thing a product declares.
*/}}
