image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ""

storage:
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""

user:
  message: "Hello from Caelus"

# TLS is injected per-deployment by the Caelus reconciler (caelus.tls). This
# default lets the chart render standalone (helm template / tests) with TLS off.
caelus:
  tls:
    enabled: false
