{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "immich-wrapper.fullname" . }}-ingress
  labels:
    {{- include "immich-wrapper.labels" . | nindent 4 }}
  {{- $tlsCustom := and .Values.caelus.tls.enabled (not .Values.caelus.tls.wildcard) }}
  {{- $annotations := merge (dict) (.Values.ingress.annotations | default dict) }}
  {{- if .Values.caelus.tls.enabled }}{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.entrypoints" "websecure" }}{{- end }}
  {{- if $tlsCustom }}{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.caelus.tls.issuer }}{{- end }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tlsCustom }}
  tls:
    - hosts:
        - {{ .Values.caelus.tls.host | quote }}
      secretName: {{ .Values.caelus.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-server
                port:
                  number: 2283
{{- end }}
