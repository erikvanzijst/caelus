{{- /*
Standalone SFTP objects (Secret, sshd-init ConfigMap, Service, sshpiper Pipe).
The sidecar itself is spliced into the server pod (see server.yaml).

Because this chart owns the server pod, the internal SFTP user is simply the
release name (the library defaults) -- none of the fixed "sftp" internal-user
juggling the subchart-wrapping charts need. We only override `selector` so the
Service targets the server pod specifically (the default instance-only selector
would also match postgres/valkey/ML pods in this namespace).
*/}}
{{ include "ssh-sidecar.sftp.resources" (dict
     "root" .
     "selector" (dict
       "app.kubernetes.io/name" "server"
       "app.kubernetes.io/instance" .Release.Name)) }}
