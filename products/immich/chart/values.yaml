# Wrapper ingress exposed by this chart (upstream ingress is disabled).
ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: "immich.local"

smtp:
  host: ""
  port: 25
  from: ""

storage:
  library:
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClassName: ""

postgresql:
  enabled: true
  image:
    repository: ghcr.io/immich-app/postgres
    tag: 14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: postgres
    database: immich
  persistence:
    accessMode: ReadWriteOnce
    size: 20Gi
    storageClassName: ""

# Values passed to upstream immich dependency chart.
immich:
  enabled: true

  controllers:
    main:
      containers:
        main:
          envFrom:
            - secretRef:
                name: postgresql-auth
          env:
            DB_HOSTNAME: postgresql
            DB_PORT: "5432"
            DB_VECTOR_EXTENSION: vectorchord

  immich:
    persistence:
      library:
        existingClaim: library

  valkey:
    enabled: true
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi

  server:
    controllers:
      main:
        # The library PVC is ReadWriteOnce, so the old and new server pods
        # cannot both hold it during an upgrade -- a surge pod would hang in
        # ContainerCreating while the old pod keeps the volume, deadlocking the
        # rollout. Keep RollingUpdate (switching an existing Deployment to
        # Recreate fails: the API forbids the K8s-defaulted rollingUpdate field)
        # but set maxSurge=0 so the old pod scales down FIRST, releasing the
        # library, before the new pod starts. Brief downtime, which is fine.
        strategy: RollingUpdate
        rollingUpdate:
          surge: "0"
          unavailable: 1
        containers:
          main:
            env:
              IMMICH_CONFIG_FILE: /config/immich-config.yaml
          sftp:
            image:
              repository: atmoz/sftp
              tag: alpine
    persistence:
      immich-config:
        enabled: true
        type: configMap
        name: immich-config
        globalMounts:
          - path: /config
            readOnly: true
      # The library claim is already mounted as the "data" volume (immich's
      # server chart). Override its mounts with advancedMounts so the SAME
      # single volume serves both containers: the app at /data (unchanged) and
      # the sftp sidecar at /home/sftp/library read-only.
      data:
        advancedMounts:
          main:
            main:
              - path: /data
            sftp:
              - path: /home/sftp/library
                readOnly: true
      sftp-users:
        type: secret
        name: sftp-credentials
        advancedMounts:
          main:
            sftp:
              - path: /etc/sftp/users.conf
                subPath: users.conf
                readOnly: true
      sftp-scripts:
        type: configMap
        name: sftp-scripts
        defaultMode: 0755
        advancedMounts:
          main:
            sftp:
              - path: /etc/sftp.d
                readOnly: true
    ingress:
      main:
        enabled: false

# TLS is injected per-deployment by the Caelus reconciler (caelus.ingress.tls). This
# default lets the chart render standalone (helm template / tests) with TLS off.
caelus:
  ingress:
    enabled: false
    tls: {}
