{{- /*
Every generated credential and the Lemmy config, in ONE Secret and ONE template
file.

Both facts are deliberate. Lemmy takes its DB password and its pict-rs API key as
literals inside its config file, so those values must be derived where the config
is rendered *and* where Postgres and pict-rs consume them. Helm scopes variables
per file, so splitting these across templates would call randAlphaNum twice on
first install and hand Lemmy a password Postgres was never initialised with.

Consumers therefore use explicit secretKeyRef rather than envFrom: the Secret
holds a config key, which is not a valid environment variable name and would
land the whole pod in InvalidVariableNames.

The config is emitted as **strict JSON**, built as a dict and serialised with
toPrettyJson rather than written out as hjson by hand. hjson is a JSON superset,
so Lemmy's deser_hjson parser accepts either -- but this way no value is ever
hand-quoted, so a hostname, site name or SMTP login containing a quote or a
backslash is escaped by the serialiser rather than by whoever edits this file
next. It also leaves a complete, valid document the init container can merge
into structurally.

What this file does NOT hold is the Lemmy admin password: that arrives as a
runtime var and must never pass through Helm values, which are logged in full at
INFO and persisted by Helm into a tenant-namespace object. `setup` is therefore
rendered without `admin_password`, and the render-config init container in
lemmy.yaml adds that one key at pod start.
*/}}
{{- $pgPassword := include "lemmy.stableSecret" (dict "root" . "key" "POSTGRES_PASSWORD" "value" .Values.postgresql.auth.password) -}}
{{- $pictrsKey := include "lemmy.stableSecret" (dict "root" . "key" "PICTRS__SERVER__API_KEY" "value" .Values.pictrs.apiKey "length" 32) -}}
{{- /* Standalone installs have no vars Secret, so the chart still needs a password to fall back on. */ -}}
{{- $platformSuppliesPassword := ne (.Values.caelus.vars.secretName | default "") "" -}}
{{- $adminPassword := "" -}}
{{- if not $platformSuppliesPassword -}}
{{- $adminPassword = include "lemmy.stableSecret" (dict "root" . "key" "admin-password" "value" .Values.admin.password) -}}
{{- end -}}
{{- /* `setup` is applied on first start only; ignored once initialised. */ -}}
{{- $setup := dict "admin_username" .Values.admin.username "site_name" .Values.siteName -}}
{{- if .Values.admin.email }}{{- $_ := set $setup "admin_email" .Values.admin.email }}{{- end -}}
{{- /* tls_enabled: federation requires the public URL to be https, which it is --
       TLS terminates at the edge and the proxy forwards plain HTTP in-cluster. */ -}}
{{- $config := dict
      "hostname" .Values.host
      "bind" "0.0.0.0"
      "port" 8536
      "tls_enabled" true
      "database" (dict
        "host" (include "lemmy.postgresHost" .)
        "port" 5432
        "user" .Values.postgresql.auth.username
        "password" $pgPassword
        "database" .Values.postgresql.auth.database
        "pool_size" (int .Values.lemmy.poolSize))
      "pictrs" (dict
        "url" (printf "http://%s-pictrs:8080/" .Release.Name)
        "api_key" $pictrsKey
        "image_mode" .Values.pictrs.imageMode)
      "federation" (dict
        "concurrent_sends_per_instance" (int .Values.lemmy.concurrentSendsPerInstance))
      "setup" $setup -}}
{{- if .Values.smtp.host -}}
{{- $email := dict
      "smtp_server" (printf "%s:%v" .Values.smtp.host .Values.smtp.port)
      "smtp_from_address" .Values.smtp.fromAddress
      "tls_type" .Values.smtp.tlsType -}}
{{- if .Values.smtp.username -}}
{{- $_ := set $email "smtp_login" .Values.smtp.username -}}
{{- $_ := set $email "smtp_password" .Values.smtp.password -}}
{{- end -}}
{{- $_ := set $config "email" $email -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "lemmy.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Consumed by the Postgres StatefulSet and the wait-for-postgres init container.
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  # Consumed by pict-rs. Lemmy needs the same key to delete images.
  PICTRS__SERVER__API_KEY: {{ $pictrsKey | quote }}
  {{- if not $platformSuppliesPassword }}
  # Only present for standalone installs. Under Caelus the tenant supplies the
  # password as a sensitive var, and this key would be a second, unused copy of
  # a credential that is deliberately write-only everywhere else.
  admin-password: {{ $adminPassword | quote }}
  {{- end }}
  # A complete, valid config -- except setup.admin_password, which render-config
  # adds at pod start.
  config.json: |
    {{- $config | toPrettyJson | nindent 4 }}
