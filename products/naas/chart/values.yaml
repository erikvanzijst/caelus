image:
  repository: python
  tag: "3.12-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ""

server:
  port: 8080

# TLS is injected per-deployment by the Caelus reconciler (caelus.tls). This
# default lets the chart render standalone (helm template / tests) with TLS off.
caelus:
  tls:
    enabled: false
