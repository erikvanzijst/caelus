{{- /*
Standalone SFTP objects (Secret, sshd-init ConfigMap, Service, sshpiper Pipe).
The sidecar rides in the nextcloud pod (see nextcloud.yaml).

internalUid/Gid 33: Nextcloud locks its data dir to www-data (33), so the SFTP
user must run as 33 or `ls` fails with "Permission denied" despite a good login.
selector targets the nextcloud pod specifically (the default instance-only
selector would also match the postgres pod).
*/}}
{{ include "caelus-sftp.resources" (dict
     "root" .
     "internalUid" 33
     "internalGid" 33
     "selector" (dict
       "app.kubernetes.io/name" "nextcloud"
       "app.kubernetes.io/instance" .Release.Name)) }}
