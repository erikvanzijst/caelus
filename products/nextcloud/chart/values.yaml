# Wrapper-level storage configuration for the Nextcloud data PVC.
# caelus.plan.storageSize (injected by reconciler) overrides storage.data.size.
storage:
  data:
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClassName: ""

# Values passed to upstream nextcloud dependency chart.
nextcloud:
  # Upstream ingress is disabled; the wrapper provides its own Ingress
  # (templates/ingress.yaml) so it can carry per-deployment TLS from caelus.ingress.tls
  # (issuer/secret/host) — static subchart values cannot. Mirrors the immich wrapper.
  ingress:
    enabled: false
    className: traefik

  phpClientHttpsFix:
    enabled: true
    protocol: "https"

  internalDatabase:
    enabled: false

  postgresql:
    enabled: true
    primary:
      persistence:
        enabled: true

  nextcloud:
    host: "nextcloud.local"
    mail:
      enabled: true
      fromAddress: "nextcloud"
      domain: "deprutser.be"
      smtp:
        host: "smtp.mailer.svc.cluster.local"
        port: 25
        secure: ""
        authtype: ""
        name: ""
        password: ""

  persistence:
    enabled: true
    existingClaim: nextcloud-data

  cronjob:
    enabled: false

  startupProbe:
    enabled: true

# TLS is injected per-deployment by the Caelus reconciler (caelus.ingress.tls). This default
# lets the chart render standalone with the wrapper Ingress disabled.
caelus:
  ingress:
    enabled: false
    tls: {}
