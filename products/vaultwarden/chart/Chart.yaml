apiVersion: v2
name: vaultwarden
description: >-
  Self-contained Freepod chart for Vaultwarden. Renders the deployment, service,
  data PVC, and per-app TLS ingress directly (no upstream dependency).
type: application
version: 3.3.1
appVersion: "1.37.1"
keywords:
  - vaultwarden
  - bitwarden
  - passwords
maintainers:
  - name: Caelus Team

# Only dependency is Freepod's own SFTP library chart (renders no resources on
# its own; provides the sidecar + Pipe/Service/Secret helpers).
dependencies:
  - name: caelus-sftp
    version: "0.2.0"
    repository: "file://../../_lib/caelus-sftp"
