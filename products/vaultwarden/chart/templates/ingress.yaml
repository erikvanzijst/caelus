{{- if .Values.caelus.ingress.enabled }}
{{- $tlsCustom := and .Values.caelus.ingress.enabled (not .Values.caelus.ingress.tls.wildcard) }}
{{- /* Upstream service name = vaultwarden.fullname: .Release.Name when it already
       contains "vaultwarden" (the Caelus case), else "<release>-vaultwarden". */ -}}
{{- $svc := .Release.Name }}
{{- if not (contains "vaultwarden" .Release.Name) }}{{- $svc = printf "%s-vaultwarden" .Release.Name }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vaultwarden-wrapper.fullname" . }}-ingress
  labels:
    {{- include "vaultwarden-wrapper.labels" . | nindent 4 }}
  {{- if $tlsCustom }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.caelus.ingress.tls.issuer | quote }}
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if $tlsCustom }}
  tls:
    - hosts:
        - {{ .Values.caelus.ingress.host | quote }}
      secretName: {{ .Values.caelus.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.caelus.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.vaultwarden.service.httpPort | default 80 }}
{{- end }}
