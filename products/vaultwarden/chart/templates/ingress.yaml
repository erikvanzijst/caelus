{{- /*
Per-app ingress. For custom domains it adds the cert-manager annotation and a
tls: block; hosts under a wildcard domain are served by Traefik's default
certificate store, so they need neither (HTTPS-only routing is the Traefik
default, no per-app annotation).
*/}}
{{- if .Values.caelus.ingress.enabled }}
{{- $tlsCustom := not .Values.caelus.ingress.tls.wildcard }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- if $tlsCustom }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.caelus.ingress.tls.issuer | quote }}
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if $tlsCustom }}
  tls:
    - hosts:
        - {{ .Values.caelus.ingress.host | quote }}
      secretName: {{ .Values.caelus.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.caelus.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-vaultwarden
                port:
                  number: {{ .Values.service.httpPort }}
{{- end }}
