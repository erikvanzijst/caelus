{{- /*
Standalone SFTP objects (credentials Secret, sshd-init ConfigMap, Service,
sshpiper Pipe). The sidecar itself rides in the vaultwarden pod — see
vaultwarden.yaml.

`selector` targets the app pod specifically. The library's default
instance-only selector would also match the bootstrap Job's pod, which carries
the same instance label and does not listen on 2222, so the Service would
publish a dead endpoint for as long as that Job exists.

internalUid is left at the library default of 1000, which matches the pod's
fsGroup — vaultwarden owns its data as an ordinary uid rather than a fixed
image-mandated one, so there is nothing to override.
*/}}
{{ include "ssh-sidecar.sftp.resources" (dict
     "root" .
     "selector" (dict
       "app.kubernetes.io/name" "vaultwarden"
       "app.kubernetes.io/instance" .Release.Name)) }}
