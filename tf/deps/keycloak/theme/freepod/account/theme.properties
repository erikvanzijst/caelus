# Freepod account-console theme — extends Keycloak's stock keycloak.v2 account
# console (a PatternFly v4 React SPA) and layers the Freepod brand on top:
# dark surface, brand logo, fonts and gradient buttons (see css/account.css).
#
# The console is a single-page app, so unlike the login theme there are no
# FreeMarker templates to override — we drive the look entirely through the
# `logo` property (read into the SPA's brand image) plus one stylesheet.
parent=keycloak.v2

# Brand logo (upper-left) and where clicking it goes. Path is relative to the
# theme's resource URL; the file lives in resources/public/logo.svg.
logo=/public/logo.svg
logoUrl=https://freepod.eu

# Loaded after the SPA's own app.css/layout.css so our rules win.
styles=css/account.css
