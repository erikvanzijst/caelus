# Email copy overrides.
#
#   *Subject     — subject lines (plain text).
#   *Body        — the PLAIN-TEXT part of each email (text/*.ftl renders these).
#                  The HTML part lives in html/*.ftl, so it isn't driven by these.
#
# Kept ASCII-only (these files can be read as Latin-1) and apostrophes are
# doubled, as MessageFormat treats a single quote as a quoting character.
# {0}=link, {2}=realm name, {3}=expiry (or actions for executeActions, whose
# expiry is {4}).

passwordResetSubject=Reset your Freepod password
emailVerificationSubject=Confirm your email for Freepod
executeActionsSubject=Action needed on your Freepod account

passwordResetBody=Someone (hopefully you) asked to reset the password for your Freepod account. Open the link below to choose a new one.\n\n{0}\n\nThis link expires in {3}. If you didn''t request a password reset, you can safely ignore this email and nothing will change.

emailVerificationBody=Welcome to Freepod. Confirm this email address to finish setting up your account and start spinning up your private apps.\n\n{0}\n\nThis link expires in {3}. If you didn''t create a Freepod account, you can safely ignore this email.

executeActionsBody=Your Freepod administrator asked you to update your account before you continue. Open the link below to take care of it.\n\n{0}\n\nThis link expires in {4}. If you weren''t expecting this, you can safely ignore this email and nothing will change.
