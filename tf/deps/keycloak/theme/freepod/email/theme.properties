# Freepod email theme — brands Keycloak's transactional emails (password reset,
# email verification, admin actions) to match freepod.eu.
#
# Email is its own world: clients strip <style> blocks and won't load web fonts,
# so everything is inline styles + table layout with web-safe fonts and a light
# background. We override html/template.ftl (the shared shell + a button macro)
# and the per-flow html templates so the call-to-action can be a styled button
# built from the raw ${link} (message-string bodies are HTML-sanitised, which
# strips inline styles — the per-template .ftl files are not).
parent=keycloak
