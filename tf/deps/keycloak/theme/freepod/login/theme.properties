# Freepod login theme — extends Keycloak's stock "keycloak.v2" PatternFly theme
# on top to match the freepod.eu landing page (see ui/src/components/landing/).
#
# We deliberately keep the parent's templates and PatternFly base intact and do
# everything through one extra stylesheet (css/login.css). The parent's own
# css/styles.css is re-listed first so its base rules load before our overrides.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/login.css
