server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Runtime env config is regenerated per deploy and must never be cached —
    # exact-match location has top priority, so it wins for this path.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Vite's fingerprinted build output: the content hash in each filename is the
    # cache-buster, so these are safe to cache forever. `^~` makes this prefix
    # win over the regex below, so hashed .css/.js/.woff2 under /assets/ get
    # immutable (not the revalidation rule).
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Unhashed public assets at stable URLs (favicon, og-image, …). No content
    # hash, so revalidate via ETag — a deploy that changes them reaches returning
    # visitors (cheap: 304 when unchanged). index.html and config.js keep their
    # own no-store rules above.
    location ~* \.(png|jpe?g|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "no-cache" always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
